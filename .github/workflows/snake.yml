name: Generate README assets

on:
  schedule:
    - cron: "0 0 * * *"   # roda todo dia à meia-noite UTC
  workflow_dispatch:       # permite rodar manualmente pela aba Actions
  push:
    branches:
      - main

jobs:
  # 🎮 Jogo do dia: gera TODOS os jogos, sorteia um e publica num nome fixo
  # (today.svg / today-dark.svg) no branch `output`. O README aponta só pra
  # esses arquivos, então o jogo muda sozinho a cada rodada sem mexer no README.
  game-of-the-day:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # 👾 Arcades do abozanona (pacman + variantes) -> dist/<jogo>-contribution-graph[-dark].svg
      - name: Generate arcade SVGs (pacman & friends)
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman,breakout,galaga,puzzle-bobble,bomberman,minesweeper'

      # 🐍 Cobrinha laranja do Platane -> dist/github-contribution-grid-snake[-dark].svg
      - name: Generate snake SVG (orange)
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=orange
            dist/github-contribution-grid-snake-dark.svg?color_snake=orange&palette=github-dark

      # 🎲 Sorteia o jogo do dia e copia pro nome canônico today[-dark].svg
      - name: Pick the game of the day
        run: |
          set -euo pipefail
          POOL=(pacman breakout galaga puzzle-bobble bomberman minesweeper snake)
          PICK="$(shuf -e "${POOL[@]}" | head -n1)"
          echo "🎲 Jogo do dia: $PICK"

          if [ "$PICK" = "snake" ]; then
            LIGHT="dist/github-contribution-grid-snake.svg"
            DARK="dist/github-contribution-grid-snake-dark.svg"
          else
            LIGHT="dist/${PICK}-contribution-graph.svg"
            DARK="dist/${PICK}-contribution-graph-dark.svg"
          fi

          # Fallback pro pacman caso o SVG sorteado não exista (gerador falhou)
          if [ ! -f "$LIGHT" ]; then
            echo "⚠️  $LIGHT não encontrado — caindo pro pacman"
            LIGHT="dist/pacman-contribution-graph.svg"
            DARK="dist/pacman-contribution-graph-dark.svg"
          fi

          cp "$LIGHT" dist/today.svg
          cp "$DARK"  dist/today-dark.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
